name: validate

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  plugin:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate manifest and required files
        run: ./scripts/validate.sh
      - name: Test model parsing and cycle history
        run: node scripts/test-model.js
      - name: Shellcheck scripts
        run: shellcheck scripts/*.sh demo/*.sh
